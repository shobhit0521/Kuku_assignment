# `python -m promopilot_ui` binds to localhost with telemetry off (see promopilot_ui/__main__.py). No server
# address is fixed here so the same app can run on a hosting service, which sets its own address.
[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "type"

[theme]
base = "light"
primaryColor = "#1F4E79"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#17202A"
font = "sans serif"
